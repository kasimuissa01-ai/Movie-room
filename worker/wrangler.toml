name = "movie-api"
main = "src/index.ts"
compatibility_date = "2024-03-01"

# Cloudflare R2 Bucket Binding (for video streaming and assets)
[[r2_buckets]]
binding = "MOVIE_BUCKET"
bucket_name = "stories"
preview_bucket_name = "stories"

# KV Namespace for Cache & Rate Limiting & User Storage
# [[kv_namespaces]]
# binding = "APP_CACHE_KV"
# id = "YOUR_KV_NAMESPACE_ID"
# preview_id = "YOUR_KV_PREVIEW_ID"

# Public configuration variables (Non-secret)
[vars]
ENVIRONMENT = "production"
API_VERSION = "v1"
CORS_ORIGIN = "*"

# SECRETS (Set via `wrangler secret put <KEY_NAME>` or Cloudflare Dashboard):
# - TMDB_API_KEY
# - JWT_SECRET
# - ADMIN_API_KEY
# - DATABASE_URL (optional)
# - DATABASE_SERVICE_KEY (optional)
# - R2_ACCESS_KEY (optional if using S3 SDK, or use direct R2 bucket binding)
# - R2_SECRET_KEY (optional if using S3 SDK, or use direct R2 bucket binding)
