name: Auto Build and Publish Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Keystore and Environment
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL_BASE: ${{ secrets.R2_PUBLIC_URL_BASE }}
        run: |
          # 1. Restore or generate signing keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Setup .env file with actual production secrets
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            touch .env
          fi

          # Replace or append production secrets if provided in GitHub Secrets
          if [ -n "$TMDB_API_KEY" ]; then
            sed -i "s|^TMDB_API_KEY=.*|TMDB_API_KEY=$TMDB_API_KEY|g" .env || echo "TMDB_API_KEY=$TMDB_API_KEY" >> .env
          fi
          if [ -n "$R2_ACCOUNT_ID" ]; then
            sed -i "s|^R2_ACCOUNT_ID=.*|R2_ACCOUNT_ID=$R2_ACCOUNT_ID|g" .env || echo "R2_ACCOUNT_ID=$R2_ACCOUNT_ID" >> .env
          fi
          if [ -n "$R2_ACCESS_KEY_ID" ]; then
            sed -i "s|^R2_ACCESS_KEY_ID=.*|R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID|g" .env || echo "R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID" >> .env
          fi
          if [ -n "$R2_SECRET_ACCESS_KEY" ]; then
            sed -i "s|^R2_SECRET_ACCESS_KEY=.*|R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY|g" .env || echo "R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY" >> .env
          fi
          if [ -n "$R2_BUCKET_NAME" ]; then
            sed -i "s|^R2_BUCKET_NAME=.*|R2_BUCKET_NAME=$R2_BUCKET_NAME|g" .env || echo "R2_BUCKET_NAME=$R2_BUCKET_NAME" >> .env
          fi
          if [ -n "$R2_PUBLIC_URL_BASE" ]; then
            sed -i "s|^R2_PUBLIC_URL_BASE=.*|R2_PUBLIC_URL_BASE=$R2_PUBLIC_URL_BASE|g" .env || echo "R2_PUBLIC_URL_BASE=$R2_PUBLIC_URL_BASE" >> .env
          fi

          # 3. Ensure gradlew executable
          chmod +x gradlew || true

      - name: Build Release APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Prepare and Upload to Cloudflare R2
        id: prep
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p release_assets
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          
          if [ -z "$APK_FILE" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi

          # Extract versionName and versionCode from app/build.gradle.kts
          VERSION_NAME=$(grep -E 'versionName\s*=\s*".*"' app/build.gradle.kts | head -n 1 | sed 's/.*versionName\s*=\s*"\(.*\)"/\1/')
          VERSION_CODE=$(grep -E 'versionCode\s*=\s*[0-9]+' app/build.gradle.kts | head -n 1 | sed 's/.*versionCode\s*=\s*\([0-9]*\)/\1/')
          
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.0.0"; fi
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="1"; fi

          echo "Detected versionName: $VERSION_NAME, versionCode: $VERSION_CODE"

          TARGET_APK_NAME="cinevault-$VERSION_NAME.apk"
          cp "$APK_FILE" "release_assets/$TARGET_APK_NAME"
          cp "$APK_FILE" "release_assets/cinevault-latest.apk"

          # Generate latest.json
          cat <<EOF > release_assets/latest.json
          {
            "success": true,
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkKey": "updates/$TARGET_APK_NAME",
            "releaseNotes": "CineVault automated release v$VERSION_NAME (Build ${{ github.run_number }})",
            "forceUpdate": false,
            "fileSizeFormatted": "45 MB"
          }
          EOF

          # Upload to Cloudflare R2 if CLOUDFLARE_API_TOKEN is provided
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Uploading APK and latest.json to Cloudflare R2 bucket 'stories'..."
            npx wrangler r2 object put stories/updates/$TARGET_APK_NAME --file="release_assets/$TARGET_APK_NAME" || echo "R2 upload warning: APK upload failed"
            npx wrangler r2 object put stories/updates/latest.json --file="release_assets/latest.json" || echo "R2 upload warning: latest.json upload failed"
          else
            echo "CLOUDFLARE_API_TOKEN not set; skipping direct R2 upload in CI (artifact available)."
          fi

          TAG_NAME="v$VERSION_NAME-b${{ github.run_number }}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "apk_named=release_assets/$TARGET_APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_path=release_assets/cinevault-latest.apk" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieRoom-APK-Build-${{ github.run_number }}
          path: release_assets/*.apk
          retention-days: 14

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag_name }}
          name: "Movie Room Update ${{ steps.prep.outputs.tag_name }}"
          body: |
            ### 🎬 Movie Room Auto-Update
            • **Build**: `${{ steps.prep.outputs.tag_name }}`
            • **Commit**: `${{ github.sha }}`
            • **Summary**: Automated build from latest commit pushed to `${{ github.ref_name }}`.

            *This APK will be automatically detected by all installed devices running Movie Room.*
          draft: false
          prerelease: false
          files: |
            ${{ steps.prep.outputs.apk_named }}
            ${{ steps.prep.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Cloudflare Worker to Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Deploying Cloudflare Worker 'movie-api' from worker/ directory..."
            cd worker
            npx wrangler deploy --name movie-api --compatibility-date 2024-03-01
            cd ..
          else
            echo "CLOUDFLARE_API_TOKEN not set; skipping Worker deployment."
          fi
